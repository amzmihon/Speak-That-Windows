name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Sanity Check
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax & Compilation
        run: |
          python -m py_compile main.py
          python -m py_compile build_release.py
          python -m py_compile installer_src.py
          python -m compileall speak_that

      - name: Run Configuration & Module Sanity Check
        run: |
          python -c "import speak_that.config as cfg; conf = cfg.get_config(); print('Config OK:', conf.keys())"
          python -c "from speak_that.selection import get_selected_text; print('Selection module OK')"
