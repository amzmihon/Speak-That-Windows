<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHD-Reader__Bionic-Reader Settings</title>
  <style>
    :root {
      --bg: #f0f0f3;
      --text-main: #333333;
      --text-muted: #666666;
      --shadow-light: #ffffff;
      --shadow-dark: #d1d1e0;
      --primary: #2196F3;
      --danger: #d32f2f;
      
      /* Shared 3D effects relying on theme variables */
      --track-inset: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      --raised-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      --pressed-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      
      --btn-raised: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      --btn-pressed: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2a2a2a;
        --text-main: #fcfcfc;
        --text-muted: #aaaaaa;
        --shadow-light: #383838;
        --shadow-dark: #1c1c1c;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 280px;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-main);
      border-bottom: none;
      padding-bottom: 16px;
      box-shadow: 0 4px 4px -4px var(--shadow-dark);
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    h1 .brand-sub {
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    h1 .brand-accent {
      color: var(--primary);
      font-size: 12px;
    }

    h1 b {
      font-weight: 800;
      color: var(--text-main);
    }

    b {
      font-weight: 700;
    }

    .icon {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      flex-shrink: 0;
      transition: stroke 0.2s, fill 0.2s;
    }

    .radio-group input:checked + .icon,
    .checkbox-group input:checked + .icon {
      stroke: var(--primary);
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .label-row label {
      font-size: 14px;
      font-weight: 600;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg);
      border-radius: 24px;
      box-shadow: var(--track-inset);
      transition: .4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--bg);
      border-radius: 50%;
      box-shadow: var(--btn-raised);
      transition: .4s;
    }

    input:checked + .slider {
      box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light), inset 0 0 8px rgba(33, 150, 243, 0.15);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--primary);
      /* Add slight inner glow/emboss to the active thumb while maintaining outer shadow */
      box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light), inset 1px 1px 2px rgba(255,255,255,0.4);
    }

    input:focus-visible + .slider {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      margin: 10px 0;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      cursor: pointer;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: var(--track-inset);
    }

    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--btn-raised);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px; /* align with track */
      
      /* Vertical grip lines */
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        var(--shadow-dark) 2px,
        var(--shadow-dark) 3px
      );
      background-size: 12px 12px;
      background-position: center;
      background-repeat: no-repeat;
    }

    input[type=range]:focus::-webkit-slider-thumb {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .slider-value {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--danger);
      background-color: var(--bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: var(--btn-raised);
    }

    .btn:active {
      box-shadow: var(--btn-pressed);
    }

    .btn.blacklisted {
      color: #fff;
      background-color: var(--danger);
      /* Custom shadow for colored background */
      box-shadow: 3px 3px 6px rgba(0,0,0,0.2), -3px -3px 6px rgba(255,255,255,0.1);
    }
    
    .btn.blacklisted:active {
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      text-align: center;
      color: var(--text-muted);
    }

    .divider {
      height: 2px;
      border: none;
      background-color: transparent;
      box-shadow: var(--track-inset);
      margin: 16px 0;
      border-radius: 2px;
    }

    /* Theme Select Dropdown & Checkboxes */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .radio-group {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .radio-group label,
    .checkbox-group label {
      flex: 1 1 calc(33.333% - 6px);
      max-width: calc(33.333% - 6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 2px;
      border-radius: 10px;
      transition: 0.2s;
      box-shadow: var(--btn-raised);
      background-color: var(--bg);
    }

    .radio-group label:has(input:checked),
    .checkbox-group label:has(input:checked) {
      box-shadow: var(--btn-pressed);
      color: var(--primary);
    }

    .radio-group label:active,
    .checkbox-group label:active {
      box-shadow: var(--btn-pressed);
    }

    /* Hide default radio/checkbox but keep accessible */
    .radio-group input[type=radio],
    .checkbox-group input[type=checkbox] {
      display: none;
    }

    /* Tabs */
    .tab-container {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      padding: 6px;
      border-radius: 12px;
      background-color: var(--bg);
      box-shadow: var(--track-inset); /* Inner groove for the tabs container */
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px 2px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      background-color: var(--bg);
      border: none;
      border-radius: 8px;
      box-shadow: var(--btn-raised); /* Outer shadow for raised physical feel */
      transition: 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--primary);
      box-shadow: var(--btn-pressed); /* physically pressed down */
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
    
    details summary {
      outline: none;
    }
  </style>
</head>

<body>
  <h1>
    <span class="brand-sub">ADHD</span> <span class="brand-accent">✦</span> <span><b>Bion</b>ic <b>Read</b>er</span>
  </h1>

  <div class="tab-container">
    <button class="tab-btn active" data-target="tab-bionic">Bionic Text</button>
    <button class="tab-btn" data-target="tab-env">Environment</button>
    <button class="tab-btn" data-target="tab-reader">Reader</button>
  </div>

  <div id="tab-bionic" class="tab-content active">
    <div class="setting-group">
      <div class="label-row">
        <label for="enable-toggle">Enable Bionic Text</label>
        <label class="switch">
          <input type="checkbox" id="enable-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group">
      <div class="label-row">
        <label for="fixation-slider">Bionic Fixation</label>
        <span class="slider-value" id="fixation-value">40%</span>
      </div>
      <input type="range" id="fixation-slider" min="10" max="100" value="40" step="10">
    </div>

    <div class="setting-group">
      <div class="label-row">
        <label for="boldness-slider">Bionic Boldness</label>
        <span class="slider-value" id="boldness-value">1.0x</span>
      </div>
      <input type="range" id="boldness-slider" min="0.1" max="5.0" value="1.0" step="0.1">
    </div>

    <details style="margin-bottom: 16px; font-size: 13px;">
      <summary style="cursor: pointer; font-weight: 600; color: #666;">Advanced Settings</summary>
      <div style="margin-top: 12px;">
        <div class="label-row" style="margin-bottom: 12px;">
          <label for="cyrillic-toggle" style="font-size: 12px; font-weight: normal;">Cyrillic (Russian, etc.)</label>
          <label class="switch" style="transform: scale(0.8); transform-origin: right;">
            <input type="checkbox" id="cyrillic-toggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="label-row" style="margin-bottom: 12px;">
          <label for="greek-toggle" style="font-size: 12px; font-weight: normal;">Greek</label>
          <label class="switch" style="transform: scale(0.8); transform-origin: right;">
            <input type="checkbox" id="greek-toggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="label-row">
          <label for="experimental-toggle" style="font-size: 12px; font-weight: normal;">Experimental (All other
            scripts)</label>
          <label class="switch" style="transform: scale(0.8); transform-origin: right;">
            <input type="checkbox" id="experimental-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </details>
  </div>

  <div id="tab-env" class="tab-content">
    <div class="setting-group">
      <div class="section-title">Display Mode</div>
      <div class="radio-group">
        <label>
          <input type="radio" name="primary-mode" id="mode-light" value="light" checked>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          Light
        </label>
        <label>
          <input type="radio" name="primary-mode" id="mode-gray" value="gray">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" opacity="0.3"></path></svg>
          Gray
        </label>
        <label>
          <input type="radio" name="primary-mode" id="mode-black" value="black">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="currentColor"></circle></svg>
          Black
        </label>
      </div>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
      <div class="section-title">Reading Aids</div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="focus-toggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          Focus
        </label>
        <label>
          <input type="checkbox" id="bw-toggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M12 3v18"></path><path d="M3 12h9" opacity="0.4"></path><path d="M3 8h9" opacity="0.4"></path><path d="M3 16h9" opacity="0.4"></path></svg>
          Grayscale
        </label>
        <label>
          <input type="checkbox" id="hc-toggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path></svg>
          Contrast
        </label>
        <label>
          <input type="checkbox" id="nightlight-toggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          Night Light
        </label>
        <label>
          <input type="checkbox" id="adhd-toggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          ADHD Mode
        </label>
      </div>
    </div>
  </div>

  <div id="tab-reader" class="tab-content">
    <div class="setting-group">
      <div class="label-row">
        <label for="reader-toggle">Enable Reader View</label>
        <label class="switch">
          <input type="checkbox" id="reader-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <p style="font-size: 12px; color: #666; margin-top: 8px;">
        Strips away clutter and extracts the main article content for a distraction-free reading experience.
      </p>
    </div>
  </div>

  <div style="margin-top: 14px;">
    <button id="blacklist-btn" class="btn">Disable on this site</button>
  </div>

  <div class="shortcuts-hint" style="margin-top: 12px; font-size: 11px; color: var(--text-muted); text-align: center; display: flex; justify-content: center; gap: 10px;">
    <span><kbd style="background: var(--bg); padding: 2px 6px; border-radius: 4px; box-shadow: var(--btn-raised); font-size: 10px; font-family: monospace;">Alt+B</kbd> Toggle</span>
    <span><kbd style="background: var(--bg); padding: 2px 6px; border-radius: 4px; box-shadow: var(--btn-raised); font-size: 10px; font-family: monospace;">Alt+R</kbd> Reader</span>
  </div>

  <div class="footer" style="margin-bottom: 4px; margin-top: 16px;">Developed by @amzmihon</div>
  <div class="footer" id="current-domain" style="margin-top: 0;">Loading...</div>

  <script src="popup.js"></script>
</body>

</html>
