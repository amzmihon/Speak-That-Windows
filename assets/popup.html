<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS AI Floating Widget</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1c1917 0%, #0c0a09 100%);
        }
        /* Ultra-transparent Glassmorphism with Light Wheat & Warm Champagne Tint */
        .glass-popup {
            background: rgba(254, 250, 224, 0.08);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 1px 2px rgba(255, 255, 255, 0.5),
                        0 0 30px rgba(212, 163, 115, 0.15);
        }
        @keyframes soundWave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .wave-bar-1 { animation: soundWave 1.1s ease-in-out infinite; }
        .wave-bar-2 { animation: soundWave 0.8s ease-in-out infinite 0.2s; }
        .wave-bar-3 { animation: soundWave 1.3s ease-in-out infinite 0.4s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-[#d4a373] selection:text-stone-950">

    <!-- Standalone Floating Pop-up Widget -->
    <div class="glass-popup rounded-2xl p-4 w-full max-w-sm text-stone-100 relative overflow-hidden transition-all duration-300 hover:border-amber-200/50">
        
        <!-- Subtle ambient glowing highlight on top edge -->
        <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#faedcd] to-transparent opacity-75"></div>

        <!-- Main Layout Row -->
        <div class="flex items-center space-x-3">
            
            <!-- AI Neural Pulse / Waveform Icon Badge -->
            <div class="relative flex items-center justify-center w-11 h-11 rounded-xl bg-[#faedcd]/15 text-[#faedcd] border border-[#faedcd]/30 shrink-0 shadow-inner">
                <!-- Sound wave animation bars -->
                <div class="flex items-center space-x-[2px] h-4">
                    <span class="w-[2px] bg-[#faedcd] rounded-full wave-bar-1"></span>
                    <span class="w-[2px] bg-amber-200 rounded-full wave-bar-2"></span>
                    <span class="w-[2px] bg-[#faedcd] rounded-full wave-bar-3"></span>
                </div>
            </div>

            <!-- Content Area: Status & Snippet -->
            <div class="flex-grow min-w-0">
                <div class="flex items-center space-x-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-300 animate-ping"></span>
                    <p class="text-xs font-semibold text-[#faedcd] tracking-tight truncate">Reading selected text...</p>
                </div>
                <p class="text-[11px] text-amber-100/70 truncate mt-0.5">"Think of the Waterfall model like building a skyscraper..."</p>
            </div>

            <!-- Minimalist Interactive Control Buttons -->
            <div class="flex items-center space-x-1.5 shrink-0">
                <!-- Pause / Resume Button -->
                <button onclick="togglePlayState(this)" id="play-btn" class="w-8 h-8 rounded-xl bg-[#faedcd]/15 hover:bg-[#faedcd]/25 text-[#faedcd] flex items-center justify-center border border-[#faedcd]/30 transition-all shadow-sm hover:scale-105 active:scale-95" title="Pause">
                    <i id="play-icon" class="fa-solid fa-pause text-xs"></i>
                </button>
                <!-- Stop Button -->
                <button onclick="stopTTS()" class="w-8 h-8 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 flex items-center justify-center border border-rose-500/30 transition-all shadow-sm hover:scale-105 active:scale-95" title="Stop">
                    <i class="fa-solid fa-square text-xs"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Client-side Interaction Script -->
    <script>
        let isPlaying = true;

        function togglePlayState(button) {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            const statusText = document.querySelector('.text-\\[\\#faedcd\\]');
            
            if (isPlaying) {
                icon.className = "fa-solid fa-pause text-xs";
                button.setAttribute('title', 'Pause');
                statusText.textContent = "Reading selected text...";
            } else {
                icon.className = "fa-solid fa-play text-xs";
                button.setAttribute('title', 'Resume');
                statusText.textContent = "Paused (Click to resume)";
            }
        }

        function stopTTS() {
            const statusText = document.querySelector('.text-\\[\\#faedcd\\]');
            statusText.textContent = "Speech stopped.";
            isPlaying = false;
            document.getElementById('play-icon').className = "fa-solid fa-play text-xs";
        }
    </script>
</body>
</html>
